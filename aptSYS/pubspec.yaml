name: apt_sys
description: A Flutter project with login screen example
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_snake_navigationbar:
    git:
      url: https://github.com/herodotdigital/SnakeBottomNavigationBar.git
  intl: ^0.20.2
  file_picker: ^8.0.0+1
  path: ^1.8.3
  flutter_keyboard_visibility: ^6.0.0
  http: ^1.6.0
  provider: ^6.1.5+1
  mockito: ^5.6.3
  shared_preferences: ^2.5.4
  yaml: ^3.1.3
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.5

flutter:
  uses-material-design: true
  assets:
    - assets/settings.yaml